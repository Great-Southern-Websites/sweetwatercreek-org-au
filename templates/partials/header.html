{@io.quarkiverse.roq.frontmatter.runtime.model.Site site}
<header class="site-header">
  <div class="container bar">
    <a class="brand" href="{=site.url}">
      <img class="logo-light" src="{=site.url('images/logo.png')}" alt="Sweetwater Creek Nature Reserve" width="400" height="89">
      <img class="logo-dark" src="{=site.url('images/logo-dark.png')}" alt="" aria-hidden="true" width="400" height="89">
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle-input" aria-label="Toggle menu">
    <label for="nav-toggle" class="nav-toggle"><span></span></label>
    <nav class="site-nav" aria-label="Main navigation">
      <ul>
        <li><a href="{=site.url('environment')}">Sweetwater Environment</a>
          <ul>
            <li><a href="{=site.url('flora')}">Flora</a></li>
            <li><a href="{=site.url('fauna')}">Fauna</a></li>
            <li><a href="{=site.url('walks')}">Walks</a></li>
            <li><a href="{=site.url('history')}">History</a></li>
          </ul>
        </li>
        <li><a href="{=site.url('get-involved')}">Get Involved</a>
          <ul>
            <li><a href="{=site.url('volunteer-sessions')}">Volunteer Sessions</a></li>
            <li><a href="{=site.url('living-classroom')}">Living Classroom</a></li>
            <li><a href="{=site.url('become-a-member')}">Become a Member</a></li>
            <li><a href="{=site.url('support-us')}">Support Us (Donations)</a></li>
          </ul>
        </li>
        <li><a href="{=site.url('news')}">News</a></li>
        <li><a href="{=site.url('contact')}">Contact Us</a></li>
        <li><a class="nav-cta" href="{=site.url('support-us')}">Donate</a></li>
      </ul>
    </nav>
  </div>
</header>
