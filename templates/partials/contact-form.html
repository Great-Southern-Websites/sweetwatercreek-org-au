{! The contact form plugin from Great Southern Websites. Put in place by the elf; the contact page includes it with
   {#include partials/contact-form /}. Fields and the recipient are set by the owner in Settings, not here. Do not edit. !}
{#bundle key="contact" tag="script" /}
<style>{|
.gsw-contact { max-width: 40rem; }
.gsw-contact-field label { display: block; font-weight: 600; margin-bottom: 0.3rem; }
.gsw-contact input, .gsw-contact textarea { width: 100%; box-sizing: border-box; min-height: 2.9rem; padding: 0.7rem 0.9rem; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-card); color: var(--fg); font: inherit; }
.gsw-contact input:focus-visible, .gsw-contact textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.gsw-contact-trap { position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden; }
.gsw-contact-error { color: #B42318; font-weight: 600; }
.gsw-contact-sent { padding: 1rem 1.2rem; border-radius: var(--radius); background: var(--bg-alt); font-weight: 600; }
|}</style>
<gsw-contact-form site="sweetwatercreek-org-au" api="https://www.greatsouthern.website"></gsw-contact-form>
